<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <style>
    .edge { stroke: #ccc; stroke-width: 2.5; fill: none; }
    .tedge { stroke: #006400; stroke-width: 3; fill: none; }
    .node { fill: #ffffff; stroke: #1f4e79; stroke-width: 2.5; }
    .l0 { fill: #fadbd8; stroke: #b00; stroke-width: 2.5; }
    .l1 { fill: #fdebd0; stroke: #b9770e; stroke-width: 2.5; }
    .l2 { fill: #d4efdf; stroke: #1e8449; stroke-width: 2.5; }
    .l3 { fill: #d6eaf8; stroke: #1f4e79; stroke-width: 2.5; }
    .label { font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    .order { font-size: 14px; font-weight: bold; text-anchor: middle; fill: #333; }
    .title { fill: #333; font-weight: bold; font-size: 18px; }
    .legend { fill: #333; font-size: 14px; }
  </style>
  <text class="title" x="20" y="30">BFS from A — by distance (level): A | B,D | E,C | F</text>

  <!-- non-tree edges -->
  <line class="edge" x1="120" y1="80"  x2="280" y2="200"/>
  <line class="edge" x1="120" y1="200" x2="280" y2="200"/>
  <line class="edge" x1="280" y1="80"  x2="440" y2="320"/>

  <!-- tree edges (BFS tree) -->
  <line class="tedge" x1="120" y1="80"  x2="280" y2="80"/>
  <line class="tedge" x1="120" y1="80"  x2="120" y2="200"/>
  <line class="tedge" x1="280" y1="80"  x2="280" y2="200"/>
  <line class="tedge" x1="280" y1="80"  x2="440" y2="200"/>
  <line class="tedge" x1="280" y1="200" x2="440" y2="320"/>

  <!-- nodes -->
  <circle class="l0" cx="120" cy="80"  r="24"/><text class="label" x="120" y="80">A</text>
  <text class="order" x="120" y="50">d=0</text>
  <circle class="l1" cx="280" cy="80"  r="24"/><text class="label" x="280" y="80">B</text>
  <text class="order" x="280" y="50">d=1</text>
  <circle class="l1" cx="120" cy="200" r="24"/><text class="label" x="120" y="200">D</text>
  <text class="order" x="85"  y="200">d=1</text>
  <circle class="l2" cx="280" cy="200" r="24"/><text class="label" x="280" y="200">E</text>
  <text class="order" x="245" y="200">d=2</text>
  <circle class="l2" cx="440" cy="200" r="24"/><text class="label" x="440" y="200">C</text>
  <text class="order" x="475" y="200">d=2</text>
  <circle class="l3" cx="440" cy="320" r="24"/><text class="label" x="440" y="320">F</text>
  <text class="order" x="440" y="355">d=3</text>
</svg>
