<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Helvetica, Arial, sans-serif" font-size="18">
  <style>
    .edge { stroke: #333; stroke-width: 2.5; fill: none; }
    .node { fill: #ffffff; stroke: #1f4e79; stroke-width: 2.5; }
    .label { fill: #1f4e79; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    .title { fill: #333; font-size: 20px; font-weight: bold; text-anchor: middle; }
  </style>
  <!-- Tree -->
  <text class="title" x="170" y="30">Tree</text>
  <line class="edge" x1="170" y1="70"  x2="100" y2="160"/>
  <line class="edge" x1="170" y1="70"  x2="240" y2="160"/>
  <line class="edge" x1="100" y1="160" x2="60"  y2="260"/>
  <line class="edge" x1="100" y1="160" x2="140" y2="260"/>
  <line class="edge" x1="240" y1="160" x2="240" y2="260"/>
  <circle class="node" cx="170" cy="70"  r="22"/><text class="label" x="170" y="70">A</text>
  <circle class="node" cx="100" cy="160" r="22"/><text class="label" x="100" y="160">B</text>
  <circle class="node" cx="240" cy="160" r="22"/><text class="label" x="240" y="160">C</text>
  <circle class="node" cx="60"  cy="260" r="22"/><text class="label" x="60"  y="260">D</text>
  <circle class="node" cx="140" cy="260" r="22"/><text class="label" x="140" y="260">E</text>
  <circle class="node" cx="240" cy="260" r="22"/><text class="label" x="240" y="260">F</text>

  <!-- Graph (with cycle, two components) -->
  <text class="title" x="540" y="30">Graph</text>
  <!-- component 1 with a cycle -->
  <line class="edge" x1="430" y1="80"  x2="540" y2="80"/>
  <line class="edge" x1="430" y1="80"  x2="430" y2="200"/>
  <line class="edge" x1="540" y1="80"  x2="540" y2="200"/>
  <line class="edge" x1="430" y1="200" x2="540" y2="200"/>
  <line class="edge" x1="430" y1="80"  x2="540" y2="200"/>
  <circle class="node" cx="430" cy="80"  r="22"/><text class="label" x="430" y="80">A</text>
  <circle class="node" cx="540" cy="80"  r="22"/><text class="label" x="540" y="80">B</text>
  <circle class="node" cx="430" cy="200" r="22"/><text class="label" x="430" y="200">C</text>
  <circle class="node" cx="540" cy="200" r="22"/><text class="label" x="540" y="200">D</text>
  <!-- component 2 -->
  <line class="edge" x1="640" y1="180" x2="660" y2="270"/>
  <circle class="node" cx="640" cy="180" r="22"/><text class="label" x="640" y="180">E</text>
  <circle class="node" cx="660" cy="270" r="22"/><text class="label" x="660" y="270">F</text>
</svg>
